# Render Blueprint for the API. Secrets are set in the Render dashboard (sync: false).
services:
  - type: web
    name: poster-maker-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: RENDER_CONCURRENCY
        value: "1"
      - key: CHROME_NO_SANDBOX
        value: "true"
      - key: APP_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
