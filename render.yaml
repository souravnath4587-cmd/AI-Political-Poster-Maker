# Render Blueprint for the API. Values marked `sync: false` are entered in the Render dashboard
# when the Blueprint is created (secrets and decisions); everything else is set here.
services:
  - type: web
    name: poster-maker-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Chromium: one render at a time fits the free tier's 512 MB; containers need --no-sandbox.
      - key: RENDER_CONCURRENCY
        value: "1"
      - key: CHROME_NO_SANDBOX
        value: "true"

      # The Vercel URL of the web app (for the Origin check), e.g. https://poster-maker.vercel.app
      - key: APP_ORIGIN
        sync: false

      # MongoDB Atlas (allow Render's outbound IPs, or 0.0.0.0/0, in Atlas network access)
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: poster-maker

      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Login codes. The pepper is generated by Render.
      - key: OTP_PEPPER
        generateValue: true
      # Must be off in production (the API refuses to start otherwise). Codes go out by SMS.
      - key: OTP_DEV_MODE
        value: "false"
      - key: BULKSMSBD_API_KEY
        sync: false
      - key: BULKSMSBD_SENDER_ID
        sync: false
      - key: REVIEWER_FREE_PHONE
        value: "01999000001"
      - key: REVIEWER_PREMIUM_PHONE
        value: "01999000002"
      - key: REVIEWER_CODE
        value: "123456"

      # Gemini (face-aware crop, headline suggestions)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_VISION_MODEL
        value: gemini-3.1-flash-lite
